name: Security

# Tres capas distintas:
#   - dependency-review: bloquea un pull request que introduce una dependencia
#     con vulnerabilidad conocida.
#   - filesystem-scan: revisa TODO el arbol, no solo lo que cambio.
#   - secret-scan: busca credenciales en el historial completo.
#
# El cron semanal existe porque una dependencia que no cambio puede volverse
# vulnerable de un dia para otro: sin el, solo se entera quien toque ese archivo.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Lunes 9:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    name: Revision de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  filesystem-scan:
    name: Analisis de vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy
        # Fijada por SHA, no por rama ni por etiqueta.
        #
        # Antes decia `@master`, que significa "ejecuta lo que haya hoy en esa
        # rama". Para una accion de terceros que corre con permiso de escritura
        # sobre security-events, eso es una via de suministro abierta: quien
        # controle ese repositorio controla lo que corre aqui.
        #
        # Una etiqueta tampoco basta. `@v0.36.0` se puede reapuntar a otro
        # commit sin cambiar de nombre; un SHA no, porque ES el contenido.
        #
        # Para subir de version: busca la etiqueta nueva en
        # https://github.com/aquasecurity/trivy-action/tags, copia su SHA
        # completo y actualiza el comentario de al lado. El SHA sin el
        # comentario es ilegible dentro de seis meses.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Subir resultados
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Busqueda de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: un secreto borrado en un commit posterior
          # sigue estando en el historial, y ahi sigue sirviendo.
          fetch-depth: 0

      - name: Gitleaks
        # A MEDIAS, y conviene saber por que.
        #
        # Antes decia `@v2`: una etiqueta de version MAYOR, que avanza sola con
        # cada release. Ahora apunta a una version concreta, asi que ya no se
        # mueve por si misma al salir una nueva.
        #
        # Pero sigue siendo una etiqueta, y una etiqueta se puede reapuntar. La
        # forma correcta es el SHA completo, como en Trivy. No se puso porque no
        # se pudo verificar cual es, y un SHA inventado no falla con un mensaje
        # claro: falla con "reference not found" y deja el flujo entero roto.
        #
        # Para cerrarlo: abre
        # https://github.com/gitleaks/gitleaks-action/tags, copia el SHA de
        # v2.3.9 y sustituyelo aqui dejando la version en el comentario.
        #
        # Nota aparte: gitleaks-action exige GITLEAKS_LICENSE en cuentas de
        # organizacion. En un repositorio personal es gratis. Si algun dia este
        # proyecto se muda a una organizacion, este paso va a empezar a fallar
        # pidiendo esa licencia.
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
