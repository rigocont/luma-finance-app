name: Frontend CI

# Formato, estilo, tipos, pruebas y compilacion del frontend.
#
# NO hay automatizacion E2E en este flujo y no debe agregarse. La
# automatizacion (Playwright + TypeScript) la desarrolla el propietario del
# proyecto por separado. Ver la seccion 3 del prompt maestro.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verificar y construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Ya existe package-lock.json, asi que el cache de npm funciona: en
          # una corrida limpia se baja el arbol entero cada vez.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        # `npm ci`, no `npm install`. La diferencia importa: `ci` instala
        # exactamente lo que dice el archivo de bloqueo y falla si no cuadra con
        # package.json, mientras que `install` puede resolver otras versiones y
        # ademas reescribe el bloqueo. Con `install`, lo que pasa en CI deja de
        # ser lo que pasa en tu maquina, y esa diferencia aparece el dia menos
        # oportuno.
        run: npm ci --no-audit --no-fund

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Build
        # `npm run build` es `tsc --noEmit && vite build`. El paso de tipos de
        # arriba es redundante a proposito: separarlo hace evidente si lo que
        # fallo fueron los tipos o el empaquetado.
        run: npm run build
