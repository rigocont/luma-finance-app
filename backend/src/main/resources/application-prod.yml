# Produccion. Sin documentacion publica, sin detalles de salud, sin trazas.
luma:
  refresh-token:
    cookie-secure: true
  mail:
    # Nunca en produccion: seria una via de acceso a las cuentas por los logs.
    log-links: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.luma: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
