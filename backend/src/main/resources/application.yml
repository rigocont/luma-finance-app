# LUMA - configuracion base.
# Los valores sensibles NUNCA van aqui: llegan por variables de entorno.
spring:
  application:
    name: luma
  profiles:
    default: local

  datasource:
    url: ${LUMA_DB_URL:jdbc:mysql://localhost:3306/luma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${LUMA_DB_USERNAME:luma}
    password: ${LUMA_DB_PASSWORD:luma}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # El esquema SIEMPRE lo gobierna Flyway. Nunca create/update.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  mail:
    host: ${LUMA_MAIL_HOST:localhost}
    port: ${LUMA_MAIL_PORT:1025}
    username: ${LUMA_MAIL_USERNAME:}
    password: ${LUMA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${LUMA_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${LUMA_MAIL_STARTTLS:false}
    # Sin esto, un servidor de correo que no responde cuelga la peticion.
    test-connection: false

  jackson:
    default-property-inclusion: non_null
    # Spring Boot 4 usa Jackson 3, que movio las opciones de fecha de
    # SerializationFeature a DateTimeFeature. No hace falta configurarlas:
    # el comportamiento que queremos (fechas ISO-8601, no epoch) ya es el
    # predeterminado. Ver docs/api.md.

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: LUMA
    version: ${project.version:0.1.0-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.luma: INFO

luma:
  cors:
    allowed-origins: ${LUMA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Valor solo para desarrollo local. En DEV/QA/PROD llega por variable de
    # entorno. Nunca se versiona un secreto real.
    secret: ${LUMA_JWT_SECRET:desarrollo-local-luma-clave-de-al-menos-32-caracteres}
    # Corta a proposito: el token de renovacion es el que da continuidad.
    access-token-ttl: ${LUMA_JWT_ACCESS_TTL:15m}
  refresh-token:
    ttl: ${LUMA_REFRESH_TTL:30d}
    cookie-name: luma_rt
    # HTTPS obligatorio fuera de desarrollo local.
    cookie-secure: ${LUMA_COOKIE_SECURE:false}
    cookie-same-site: ${LUMA_COOKIE_SAME_SITE:Lax}
    cookie-path: /api/v1/auth
  app:
    # Base de los enlaces que se envian por correo.
    base-url: ${LUMA_APP_BASE_URL:http://localhost:8081}
  mail:
    from: ${LUMA_MAIL_FROM:LUMA <no-reply@luma.app>}
    log-links: ${LUMA_MAIL_LOG_LINKS:false}
  password-reset:
    ttl: ${LUMA_PASSWORD_RESET_TTL:1h}
    resend-cooldown: ${LUMA_PASSWORD_RESET_COOLDOWN:2m}
